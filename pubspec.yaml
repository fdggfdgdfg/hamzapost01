name: hamzapost
description: Simple Flutter RSS news reader for Moroccan headlines (Web/Mobile).
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  webfeed: ^0.7.0
  intl: ^0.19.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/feeds.json